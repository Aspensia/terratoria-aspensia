<template>
  <style>
    @font-face { font-family: "Space Grotesk"; src: url("assets/fonts/space-grotesk.woff2") format("woff2"); font-weight: 300 700; }
    @font-face { font-family: "Geist Mono"; src: url("assets/fonts/geist-mono.woff2") format("woff2"); font-weight: 100 900; }
    #root { position: absolute; inset: 0; }
    #gm-pills { position: absolute; left: 50%; top: 120px; margin-left: -620px; width: 1240px; height: 76px; }
    .pill { position: absolute; top: 0; width: 290px; height: 76px; border: 1px solid rgba(255, 255, 255, 0.16); border-radius: 16px; background: rgba(22, 24, 28, 0.7); padding: 12px 20px; }
    .pill b { display: block; font: 600 30px/1.05 "Space Grotesk", sans-serif; color: #ededef; }
    .pill span { font: 400 21px/1.3 "Geist Mono", monospace; letter-spacing: 0.04em; white-space: nowrap; color: #9d9fa6; }
    #gm-lit { position: absolute; top: -2px; left: -2px; width: 294px; height: 80px; border: 2px solid #a9bfd6; border-radius: 18px; background: rgba(169, 191, 214, 0.1); }
    .panel { position: absolute; overflow: hidden; border-radius: 18px; border: 1px solid rgba(255, 255, 255, 0.2); background: #0e0f12; }
    .panel img { position: absolute; }
    #gm-hint-frame { position: absolute; left: 0; top: 444px; width: 760px; height: 104px; border: 2px solid #e6b34d; border-radius: 12px; }
  </style>
  <div id="root" data-composition-id="games" data-width="1920" data-height="1080">
    <div id="gm-pills" class="clip" data-start="0" data-duration="5.85">
      <div id="gm-p1" class="pill" style="left: 0"><b>Quiz</b><span>10 rounds</span></div>
      <div id="gm-p2" class="pill" style="left: 316px"><b>Rush</b><span>60 seconds</span></div>
      <div id="gm-p3" class="pill" style="left: 632px"><b>Flashcards</b><span>Flip and learn</span></div>
      <div id="gm-p4" class="pill" style="left: 948px"><b>Touchdown</b><span>Land a rocket</span></div>
      <div id="gm-lit"></div>
    </div>

    <!-- Each panel is a crop of the real game, scaled so its text stays legible. -->
    <div id="gm-quiz" class="clip panel" data-start="0.15" data-duration="1.45" style="left: 512px; top: 230px; width: 896px; height: 560px">
      <img src="assets/shots/quiz.jpg" alt="Quiz round with two hints shown" style="left: -512px; top: -446px; width: 1920px; height: 1080px" />
      <div id="gm-hint-frame"></div>
    </div>
    <div id="gm-rush" class="clip panel" data-start="1.5" data-duration="1.5" style="left: 468px; top: 230px; width: 984px; height: 560px">
      <img src="assets/shots/rush.jpg" alt="Rush: 60-second clock running" style="left: -514px; top: -395px; width: 2108px; height: 1186px" />
    </div>
    <div id="gm-front" class="clip panel" data-start="2.9" data-duration="0.75" style="left: 260px; top: 258px; width: 1400px; height: 505px">
      <img src="assets/shots/cards-front.jpg" alt="Flashcard question side" style="left: -760px; top: -666px; width: 2918px; height: 1642px" />
    </div>
    <div id="gm-back" class="clip panel" data-start="3.6" data-duration="0.8" style="left: 260px; top: 258px; width: 1400px; height: 505px">
      <img src="assets/shots/cards-back.jpg" alt="Flashcard answer side" style="left: -760px; top: -666px; width: 2918px; height: 1642px" />
    </div>
    <div id="gm-td1" class="clip panel" data-start="4.3" data-duration="0.4" style="left: 401px; top: 230px; width: 1118px; height: 560px">
      <img src="assets/shots/touchdown-1.jpg" alt="Touchdown: descent on the Moon" style="left: -641px; top: -644px; width: 2400px; height: 1350px" />
    </div>
    <div id="gm-td2" class="clip panel" data-start="4.68" data-duration="0.4" style="left: 401px; top: 230px; width: 1118px; height: 560px">
      <img src="assets/shots/touchdown-2.jpg" alt="Touchdown: engine burning" style="left: -641px; top: -644px; width: 2400px; height: 1350px" />
    </div>
    <div id="gm-td3" class="clip panel" data-start="5.06" data-duration="0.79" style="left: 401px; top: 230px; width: 1118px; height: 560px">
      <img src="assets/shots/touchdown-3.jpg" alt="Touchdown: braking" style="left: -641px; top: -644px; width: 2400px; height: 1350px" />
    </div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    tl.fromTo(".pill", { opacity: 0, y: -24 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out", stagger: 0.06 }, 0)
      .fromTo("#gm-lit", { x: 0, opacity: 0 }, { x: 0, opacity: 1, duration: 0.2 }, 0.2)
      .to("#gm-lit", { x: 316, duration: 0.3, ease: "power3.inOut" }, 1.45)
      .to("#gm-lit", { x: 632, duration: 0.3, ease: "power3.inOut" }, 2.85)
      .to("#gm-lit", { x: 948, duration: 0.3, ease: "power3.inOut" }, 4.25)
      // Quiz: panel lands, the two hints light up.
      .fromTo("#gm-quiz img", { scale: 0.92, opacity: 0, transformOrigin: "960px 700px" }, { scale: 1, opacity: 1, duration: 0.35, ease: "power3.out" }, 0.15)
      .fromTo("#gm-hint-frame", { opacity: 0, scale: 1.05 }, { opacity: 1, scale: 1, duration: 0.25, ease: "power2.out" }, 0.75)
      // Rush: slides in from the right.
      .fromTo("#gm-rush img", { x: 260, opacity: 0 }, { x: 0, opacity: 1, duration: 0.35, ease: "power3.out" }, 1.5)
      .to("#gm-rush img", { scale: 1.06, duration: 1.1, ease: "none", transformOrigin: "1500px 800px" }, 1.85)
      // Flashcards: question side, then the card flips to the answer.
      .fromTo("#gm-front img", { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "power3.out" }, 2.9)
      .to("#gm-front img", { scaleX: 0, duration: 0.14, ease: "power2.in", transformOrigin: "1460px 900px" }, 3.5)
      .fromTo("#gm-back img", { scaleX: 0, transformOrigin: "1460px 900px" }, { scaleX: 1, duration: 0.16, ease: "power2.out" }, 3.62)
      // Touchdown: three real frames of the descent and burn, with a small shake on the burn.
      .fromTo("#gm-td1 img", { scale: 0.94, opacity: 0, transformOrigin: "1300px 1000px" }, { scale: 1, opacity: 1, duration: 0.25, ease: "power3.out" }, 4.3)
      .fromTo("#gm-td2 img", { x: -4 }, { x: 4, duration: 0.05, repeat: 5, yoyo: true, ease: "none" }, 4.7)
      .to(".pill, #gm-lit, #gm-td3 img", { x: "-=280", opacity: 0, filter: "blur(12px)", duration: 0.25, ease: "power3.in" }, 5.72);
    // Each panel's box fades in with its picture, so an empty frame never covers the previous game.
    [["#gm-quiz", 0.15], ["#gm-rush", 1.5], ["#gm-front", 2.9], ["#gm-td1", 4.3]].forEach(([id, t]) => tl.fromTo(id, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, t));
    window.__timelines["games"] = tl;
  </script>
</template>
