<template>
  <style>
    #root { position: absolute; inset: 0; }
    #s3d-canvas { position: absolute; inset: 0; width: 1920px; height: 1080px; }
  </style>
  <div id="root" data-composition-id="space3d" data-width="1920" data-height="1080">
    <canvas id="s3d-canvas" width="1920" height="1080"></canvas>
  </div>
  <script>
    (() => {
      // Earth, Moon and Mars from the Terratoria site's own textures. Every frame is a pure function of t.
      // Shown 0–4.3 s (fly-in), 8–10.4 s (Mars orbit and the Jezero pin click at 10.0 s) and 27.7–30 s (pull-back).
      const T = window.THREE;
      const canvas = document.getElementById("s3d-canvas");
      const renderer = new T.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
      renderer.setPixelRatio(1);
      renderer.setSize(1920, 1080, false);
      renderer.outputColorSpace = T.SRGBColorSpace;
      const scene = new T.Scene();
      const camera = new T.PerspectiveCamera(38, 1920 / 1080, 0.01, 1000);

      const EARTH = new T.Vector3(0, 0, 0), MOON = new T.Vector3(2.2, 0.4, 6.0), MARS = new T.Vector3(-2.6, -0.5, 15.5);
      const load = (f) => new T.TextureLoader().loadAsync("assets/tex/" + f).then((t) => ((t.colorSpace = T.SRGBColorSpace), (t.anisotropy = 8), t));

      const fresnel = (color, power, strength) =>
        new T.ShaderMaterial({
          uniforms: { c: { value: new T.Color(color) } },
          vertexShader: "varying vec3 vN; varying vec3 vV; void main(){ vN = normalize(normalMatrix*normal); vec4 mv = modelViewMatrix*vec4(position,1.0); vV = normalize(-mv.xyz); gl_Position = projectionMatrix*mv; }",
          fragmentShader: `uniform vec3 c; varying vec3 vN; varying vec3 vV; void main(){ float f = pow(1.0 - max(dot(vN, vV), 0.0), ${power.toFixed(1)}); gl_FragColor = vec4(c * f * ${strength.toFixed(2)}, f); }`,
          transparent: true, blending: T.AdditiveBlending, depthWrite: false,
        });

      let earth, moon, mars, pin, ready = false;
      // Seeded starfield (mulberry32) in front of the Milky Way.
      let a = 1234567;
      const rnd = () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
      const starPos = new Float32Array(2400 * 3);
      for (let i = 0; i < 2400; i++) {
        const u = rnd() * 2 - 1, th = rnd() * Math.PI * 2, r = 120 + rnd() * 60, s = Math.sqrt(1 - u * u);
        starPos.set([r * s * Math.cos(th), r * u, r * s * Math.sin(th)], i * 3);
      }
      const starGeo = new T.BufferGeometry();
      starGeo.setAttribute("position", new T.BufferAttribute(starPos, 3));
      scene.add(new T.Points(starGeo, new T.PointsMaterial({ color: 0xdfe8ff, size: 0.55, sizeAttenuation: true, transparent: true, opacity: 0.85 })));

      const sun = new T.DirectionalLight(0xfff4e6, 2.6);
      sun.position.set(7, 2.5, 6);
      scene.add(sun, new T.AmbientLight(0x8899bb, 0.16));

      const build = Promise.all(["earth.jpg", "moon.jpg", "mars.jpg", "milkyway.jpg"].map(load)).then(([te, tm, tr, tw]) => {
        const sky = new T.Mesh(new T.SphereGeometry(300, 48, 32), new T.MeshBasicMaterial({ map: tw, side: T.BackSide, color: 0x7d8496 }));
        scene.add(sky);
        const planet = (tex, r, pos, rough) => {
          const m = new T.Mesh(new T.SphereGeometry(r, 96, 64), new T.MeshStandardMaterial({ map: tex, roughness: rough, metalness: 0 }));
          m.position.copy(pos);
          scene.add(m);
          return m;
        };
        earth = planet(te, 1, EARTH, 0.85);
        const air = new T.Mesh(new T.SphereGeometry(1.035, 64, 48), fresnel(0x56b4e9, 3.2, 1.6));
        earth.add(air);
        moon = planet(tm, 0.27, MOON, 1);
        mars = planet(tr, 0.53, MARS, 0.95);
        mars.add(new T.Mesh(new T.SphereGeometry(0.545, 48, 32), fresnel(0xe0865c, 4.0, 0.7)));
        // Jezero crater pin (18.4° N, 77.5° E) on the Mars surface.
        const lat = (18.4 * Math.PI) / 180, lon = (77.5 * Math.PI) / 180, r = 0.535;
        pin = new T.Group();
        pin.position.set(r * Math.cos(lat) * Math.cos(lon), r * Math.sin(lat), -r * Math.cos(lat) * Math.sin(lon));
        const dot = new T.Mesh(new T.SphereGeometry(0.018, 16, 12), new T.MeshBasicMaterial({ color: 0xe69f00 }));
        const ring = new T.Mesh(new T.RingGeometry(0.03, 0.038, 48), new T.MeshBasicMaterial({ color: 0xe69f00, side: T.DoubleSide, transparent: true }));
        ring.lookAt(pin.position.clone().multiplyScalar(2));
        pin.add(dot, ring);
        pin.userData.ring = ring;
        mars.add(pin);
        ready = true;
        return renderer.compileAsync(scene, camera);
      });
      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["space3d"] = build.then(() => renderAt(0));

      const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
      const clamp01 = (x) => Math.min(1, Math.max(0, x));
      const flyPath = new T.CatmullRomCurve3([new T.Vector3(0.6, 0.9, 27), new T.Vector3(-0.9, 0.2, 18.2), new T.Vector3(2.9, 0.65, 8.6), new T.Vector3(0.6, 0.28, 3.85)]);
      const look = new T.Vector3(), pos = new T.Vector3();

      function renderAt(t) {
        if (!ready) return;
        earth.rotation.y = 2.2 + t * 0.09;
        moon.rotation.y = t * 0.05;
        let visible = true;
        if (t < 4.4) {
          // Fly-in: fast at first, settling as Earth arrives on the right of frame.
          const u = 1 - Math.pow(1 - clamp01(t / 4.0), 2.4);
          flyPath.getPointAt(u, pos);
          look.copy(MARS).lerp(new T.Vector3(-1.15, 0.05, 0), ease(clamp01((t - 0.4) / 3.2)));
          mars.rotation.y = 1 + t * 0.2;
        } else if (t >= 7.9 && t < 10.6) {
          // Mars orbit: the camera swings round while Mars turns, so the Jezero pin faces the camera at 10.0 s (the click).
          const k = clamp01((t - 8) / 2.0);
          const az = 0.95 - 0.7 * ease(k), dist = 2.3 - 0.75 * ease(k);
          pos.set(MARS.x + Math.sin(az) * dist, MARS.y + 0.22, MARS.z + Math.cos(az) * dist);
          look.copy(MARS);
          const camAz = Math.atan2(pos.x - MARS.x, pos.z - MARS.z);
          const pinAz = Math.atan2(pin.position.x, pin.position.z);
          mars.rotation.y = camAz - pinAz + 0.55 * (t - 10);
          const pulse = 1 + 0.6 * ((t * 1.6) % 1);
          pin.userData.ring.scale.setScalar(pulse);
          pin.userData.ring.material.opacity = 1 - ((t * 1.6) % 1);
        } else if (t >= 27.6) {
          // Finale: pull back from Earth to show Earth and the Moon, Mars far behind.
          const k = 1 - Math.pow(1 - clamp01((t - 27.7) / 2.2), 3);
          pos.set(-0.2, 0.15, 2.3).lerp(new T.Vector3(-3.4, 1.5, 9.4), k);
          look.set(0, 0, 0).lerp(new T.Vector3(-0.7, -1.05, 0), k);
          mars.rotation.y = t * 0.1;
        } else visible = false;
        if (!visible) return;
        camera.position.copy(pos);
        camera.lookAt(look);
        renderer.render(scene, camera);
      }
      window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));

      const tl = gsap.timeline({ paused: true });
      // Later fades must not render their start state at build time, or the intro would begin hidden.
      tl.set("#s3d-canvas", { opacity: 1 }, 0)
        .to("#s3d-canvas", { opacity: 0, duration: 0.3, ease: "power2.in" }, 4.0)
        .to("#s3d-canvas", { opacity: 1, duration: 0.25, ease: "power2.out" }, 7.95)
        .to("#s3d-canvas", { opacity: 0, duration: 0.2, ease: "power2.in" }, 10.2)
        .to("#s3d-canvas", { opacity: 1, duration: 0.35, ease: "power2.out" }, 27.65);
      window.__timelines["space3d"] = tl;
    })();
  </script>
</template>
